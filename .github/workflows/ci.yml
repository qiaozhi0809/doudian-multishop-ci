name: ci

on:
  push:
  pull_request:

jobs:
  backend-linux:
    # 主仓库私有且 Actions 因账单无法启动，只在公开 CI 镜像上运行（CLAUDE.md）
    if: github.repository == 'qiaozhi0809/doudian-multishop-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 依赖
        working-directory: backend
        run: uv sync
      - name: ruff
        working-directory: backend
        run: uv run ruff check .
      - name: pytest
        working-directory: backend
        run: uv run pytest -q
      - name: openapi.json 与后端一致
        run: |
          (cd backend && uv run python -m app.main --export-openapi ../frontend/openapi.json)
          git diff --exit-code frontend/openapi.json
      - name: 守门脚本
        run: |
          bash scripts/ci/check-file-length.sh
          bash scripts/ci/check-secrets.sh
          bash scripts/ci/check-backend-layers.sh

  backend-windows:
    # 主仓库私有且 Actions 因账单无法启动，只在公开 CI 镜像上运行（CLAUDE.md）
    if: github.repository == 'qiaozhi0809/doudian-multishop-ci'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 依赖
        working-directory: backend
        run: uv sync
      - name: pytest（含 DPAPI）
        working-directory: backend
        run: uv run pytest -q
