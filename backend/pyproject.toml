[project]
name = "doudian-multishop-backend"
version = "0.1.0"
description = "抖店多店铺管理后台（本机）"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "curl_cffi>=0.7",
  "playwright>=1.48",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "structlog>=24.4",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "pywin32>=308; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
